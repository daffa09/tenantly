events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream ui_upstream  { server frontend:3000; }
    upstream api_upstream { server backend:3001; }

    server {
        listen 80;

        # Every Nest controller is mounted under /api/v1, so the API is same-origin
        # with the UI: no preflight, no second certificate, no CORS_ORIGINS to keep
        # in sync. Caddy terminates TLS in front of this and forwards X-Forwarded-*.
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            proxy_pass http://ui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
