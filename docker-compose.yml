services:
  tenantly-redis:
    image: redis:7-alpine
    container_name: tenantly-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - postgres_default

  backend:
    build: ./backend
    image: ${DOCKERHUB_USERNAME}/tenantly-api:latest
    container_name: tenantly-api
    restart: always
    ports:
      - "127.0.0.1:${API_PORT}:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: tenantly-redis
      REDIS_PORT: 6379
      NODE_ENV: production
    depends_on:
      - tenantly-redis
    networks:
      - postgres_default

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: ${DOCKERHUB_USERNAME}/tenantly-web:latest
    container_name: tenantly-web
    restart: always
    ports:
      - "127.0.0.1:${WEB_PORT}:3000"
    depends_on:
      - backend
    networks:
      - postgres_default

volumes:
  redis_data:

networks:
  postgres_default:
    external: true
